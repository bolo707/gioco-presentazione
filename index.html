let cols,rows,portrait,k=1,bx=0,by=0,sw=0,sh=0,pieces=[],placed=0,state='play',L={},board,imgG,drag=null;
const EDGE='rgba(60,20,40,.35)';
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const x in a)e.setAttribute(x,a[x]);if(p)p.appendChild(e);return e};
const rnd=(a,b)=>a+Math.random()*(b-a);
function anim(d,fn,done){const t0=performance.now();(function f(t){const u=Math.min(1,Math.max(0,(t-t0)/d));fn(u);u<1?requestAnimationFrame(f):done&&done()})(t0);}
const starPts=(R)=>{let p=[];for(let i=0;i<10;i++){const a=Math.PI/5*i-Math.PI/2,r=i%2?R*.45:R;p.push((Math.cos(a)*r).toFixed(1)+','+(Math.sin(a)*r).toFixed(1))}return p.join(' ')};
const star=(x,y,R,f)=>`<polygon transform="translate(${x} ${y})" points="${starPts(R)}" fill="${f}"/>`;

/* bordo a incastro: curva condivisa tra due pezzi */
function edge(x0,y0,x1,y1){
 const dx=x1-x0,dy=y1-y0,Ln=Math.hypot(dx,dy),ux=dx/Ln,uy=dy/Ln,s=Math.random()<.5?1:-1,nx=uy*s,ny=-ux*s;
 const t=rnd(.09,.11),a=rnd(-.03,.03),b=rnd(-.04,.04),c=rnd(-.02,.02),e=rnd(-.03,.03);
 const P=(l,w)=>({x:x0+ux*l*Ln+nx*w*Ln,y:y0+uy*l*Ln+ny*w*Ln});
 return [P(0,0),P(.2,a),P(.5+b,-t+c),P(.5-t+b,t+c),P(.5-2*t+b,3*t+c),P(.5+2*t+b,3*t+c),P(.5+t+b,t+c),P(.5+t+b,-t+c),P(.8,e),P(1,0)];
}
const C=(a,b,c)=>`C${a.x.toFixed(1)} ${a.y.toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)} ${c.x.toFixed(1)} ${c.y.toFixed(1)}`;
const fwd=p=>C(p[1],p[2],p[3])+C(p[4],p[5],p[6])+C(p[7],p[8],p[9]);
const rev=p=>C(p[8],p[7],p[6])+C(p[5],p[4],p[3])+C(p[2],p[1],p[0]);

function build(){

 const r=stage.getBoundingClientRect();portrait=r.height>r.width;
 cols=portrait?2:5;rows=portrait?5:2;

 const defs=el('defs',{},svg);defs.innerHTML=artDefs();

 const hE=[],vE=[];
 for(let r=1;r<rows;r++){hE[r]=[];for(let c=0;c<cols;c++)hE[r][c]=edge(c*U,r*U,(c+1)*U,r*U)}
 for(let r=0;r<rows;r++){vE[r]=[];for(let c=1;c<cols;c++)vE[r][c]=edge(c*U,r*U,c*U,(r+1)*U)}
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
  const x=c*U,y=r*U,i=pieces.length;
  const d=`M${x} ${y}`+(r?fwd(hE[r][c]):`L${x+U} ${y}`)+(c<cols-1?fwd(vE[r][c+1]):`L${x+U} ${y+U}`)+(r<rows-1?rev(hE[r+1][c]):`L${x} ${y+U}`)+(c?rev(vE[r][c]):`L${x} ${y}`)+'Z';
  const cp=el('clipPath',{id:'cp'+i},defs);el('path',{d},cp);
  el('path',{d,fill:'#eef2fb',stroke:'#c5d0ea','stroke-width':1.5,'stroke-dasharray':'5 4'},L.ghost);
  const g=el('g',{filter:'url(#sh)'},L.loose);g.style.cursor='grab';g.dataset.i=i;g.classList.add('piece');
  g.innerHTML=`<g clip-path="url(#cp${i})"><use href="#art"/></g><path d="${d}" fill="none" stroke="${EDGE}" stroke-width="1.4" stroke-linejoin="round"/>`;
  pieces.push({i,g,edge:g.lastChild,cx:x+U/2,cy:y+U/2,ox:0,oy:0,s:1,placed:false});
 }
 layout();scatter();
}
const setT=p=>p.g.setAttribute('transform',`translate(${p.ox} ${p.oy}) translate(${p.cx} ${p.cy}) scale(${p.s}) translate(${-p.cx} ${-p.cy})`);
function applyBoard(s){const bw=cols*U,bh=rows*U;board.setAttribute('transform',`translate(${bx+bw*k/2} ${by+bh*k/2}) scale(${k*s}) translate(${-bw/2} ${-bh/2})`)}
function layout(){
 const r=stage.getBoundingClientRect();sw=r.width;sh=r.height;svg.setAttribute('viewBox',`0 0 ${sw} ${sh}`);
 const bw=cols*U,bh=rows*U;
 k=portrait?Math.min(sw*.48/bw,sh*.55/bh,1.5):Math.min(sw*.5/bw,sh*.36/bh,1.6);
 bx=(sw-bw*k)/2;by=(sh-bh*k)/2;applyBoard(1);
 pieces.forEach(p=>{if(!p.placed){clampP(p);setT(p)}});
 if(state==='open')fitImage(1);
}
function clampP(p){const m=U*k*.4,x=bx+(p.cx+p.ox)*k,y=by+(p.cy+p.oy)*k;
 p.ox+=(Math.min(Math.max(x,m),sw-m)-x)/k;p.oy+=(Math.min(Math.max(y,m),sh-m)-y)/k}
function scatter(){
 const m=U*k*.7,bw=cols*U*k,bh=rows*U*k,pad=m*.6,pts=[];let gap=U*k*.95;
 pieces.forEach(p=>{let best=null;
  for(let t=0;t<500&&!best;t++){
   if(t%100==99)gap*=.85;
   const x=rnd(m,sw-m),y=rnd(m,sh-m);
   if(x>bx-pad&&x<bx+bw+pad&&y>by-pad&&y<by+bh+pad)continue;
   if(pts.every(q=>Math.hypot(q.x-x,q.y-y)>gap))best={x,y};
  }
  if(!best)best={x:rnd(m,sw-m),y:rnd(m,sh-m)};
  pts.push(best);p.ox=(best.x-bx)/k-p.cx;p.oy=(best.y-by)/k-p.cy;setT(p);
 });
}

/* trascinamento */
svg.addEventListener('pointerdown',e=>{
 const g=e.target.closest&&e.target.closest('.piece');if(!g||state!=='play')return;
 const p=pieces[+g.dataset.i];if(p.placed)return;
 e.preventDefault();svg.setPointerCapture(e.pointerId);L.loose.appendChild(g);g.style.cursor='grabbing';
 drag={p,id:e.pointerId,sx:e.clientX,sy:e.clientY,ox:p.ox,oy:p.oy};p.s=1.06;setT(p);
});
svg.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.id)return;const p=drag.p;
 p.ox=drag.ox+(e.clientX-drag.sx)/k;p.oy=drag.oy+(e.clientY-drag.sy)/k;clampP(p);setT(p);
});
function endDrag(e){
 if(!drag||e.pointerId!==drag.id)return;const p=drag.p;drag=null;p.s=1;p.g.style.cursor='grab';
 if(Math.hypot(p.ox,p.oy)<32){p.ox=p.oy=0;p.placed=true;p.g.removeAttribute('filter');p.g.style.cursor='default';L.placed.appendChild(p.g);setT(p);placed++;celebrate(p);if(placed===pieces.length)complete()}
 else setT(p);
}
svg.addEventListener('pointerup',endDrag);svg.addEventListener('pointercancel',endDrag);

/* animazione "pezzo corretto" */
function celebrate(p){
 const {cx,cy}=p;
 const ring=el('circle',{cx,cy,r:10,fill:'none',stroke:'#22c55e'},L.fx);
 anim(600,u=>{ring.setAttribute('r',10+70*u);ring.setAttribute('opacity',1-u);ring.setAttribute('stroke-width',6*(1-u)+1)},()=>ring.remove());
 const ck=el('g',{},L.fx);
 ck.innerHTML='<circle r="20" fill="#22c55e" stroke="#fff" stroke-width="3"/><path d="M-9 0L-3 7L10-8" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>';
 anim(900,u=>{const s=u<.25?u/.25*1.15:u<.4?1.15-(u-.25)/.15*.15:1;ck.setAttribute('transform',`translate(${cx} ${cy}) scale(${s})`);ck.setAttribute('opacity',u>.7?1-(u-.7)/.3:1)},()=>ck.remove());
 const cols_=['#ffd23f','#fff','#3ddc97','#4cc9f0','#ff7aa2'];
 const sp=[...Array(10)].map((_,i)=>{const a=Math.PI*2*i/10+rnd(-.2,.2);return{a,d:rnd(45,80),e:el('polygon',{points:starPts(rnd(6,10)),fill:cols_[i%5]},L.fx)}});
 anim(800,u=>sp.forEach(q=>{q.e.setAttribute('transform',`translate(${cx+Math.cos(q.a)*q.d*u} ${cy+Math.sin(q.a)*q.d*u}) rotate(${u*200}) scale(${1-u*.6})`);q.e.setAttribute('opacity',1-u)}),()=>sp.forEach(q=>q.e.remove()));
 anim(450,u=>{p.s=1+.12*Math.sin(Math.PI*u);setT(p)},()=>{p.s=1;setT(p)});
 p.edge.setAttribute('stroke','#22c55e');p.edge.setAttribute('stroke-width',3.5);
 setTimeout(()=>{p.edge.setAttribute('stroke',EDGE);p.edge.setAttribute('stroke-width',1.4)},700);
}

function complete(){
 state='done';
 const tit=document.getElementById('titolo');
 setTimeout(()=>{tit.style.opacity=0;setTimeout(()=>{tit.textContent='Buon Compleanno!!';tit.style.opacity=1},380)},400);
 setTimeout(()=>{
  anim(600,u=>pieces.forEach(p=>p.edge.setAttribute('opacity',1-u)),()=>{L.ghost.style.display='none'});
  anim(700,u=>applyBoard(1+.06*Math.sin(Math.PI*u)),()=>applyBoard(1));
  confetti();
  setTimeout(()=>btn.classList.add('on'),700);
 },700);
}
function confetti(){
 const cs=['#ee4266','#ffd23f','#3ddc97','#4cc9f0','#b388ff','#fff'],ox=bx+cols*U*k/2,oy=by+rows*U*k/2;
 const ps=[...Array(44)].map(()=>{const a=rnd(-Math.PI*.95,-Math.PI*.05),v=rnd(250,560);
  return{vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:rnd(0,360),w:rnd(-400,400),e:el('rect',{x:-4,y:-6,width:8,height:12,fill:cs[Math.floor(rnd(0,cs.length))]},L.sfx)}});
 anim(1700,u=>{const t=u*1.7;ps.forEach(q=>{q.e.setAttribute('transform',`translate(${ox+q.vx*t} ${oy+q.vy*t+450*t*t}) rotate(${q.r+q.w*t})`);q.e.setAttribute('opacity',u>.7?1-(u-.7)/.3:1)})},()=>ps.forEach(q=>q.e.remove()));
}

/* scarta → immagine INVITO */
let iw=0,ih=0;
function fitImage(s){
 iw=Math.min(sw*.94,sh*.96*IW/IH);ih=iw*IH/IW;
 imgG.setAttribute('transform',`translate(${sw/2} ${sh/2}) scale(${s}) translate(${-iw/2} ${-ih/2})`);
 [...imgG.children].forEach(c=>{c.setAttribute('width',iw);c.setAttribute('height',ih)});
}
btn.addEventListener('click',()=>{
 if(state!=='done')return;state='open';btn.classList.remove('on');btn.disabled=true;
 const bw=cols*U,bh=rows*U;
 pieces.forEach(p=>{const a=Math.atan2(p.cy-bh/2,p.cx-bw/2)+rnd(-.4,.4);p.v=[Math.cos(a),Math.sin(a),rnd(-160,160),rnd(260,420)]});
 anim(750,u=>{const e=u*u;pieces.forEach(p=>{p.g.setAttribute('transform',`translate(${p.v[0]*p.v[3]*e} ${p.v[1]*p.v[3]*e}) rotate(${p.v[2]*e} ${p.cx} ${p.cy})`);p.g.setAttribute('opacity',1-u)})},()=>{L.placed.style.display='none'});
 setTimeout(()=>{
  imgG=el('g',{opacity:0},L.img);
  el('rect',{rx:10,fill:'#fff',stroke:'#d9e0ee','stroke-width':2,filter:'url(#sh)'},imgG);
  el('image',{href:INVITO,preserveAspectRatio:'xMidYMid meet'},imgG);
  anim(800,u=>{const c1=1.70158,c3=c1+1,v=u-1,e=1+c3*v*v*v+c1*v*v;imgG.setAttribute('opacity',Math.min(1,u*2.2));fitImage(.3+.7*e)},()=>fitImage(1));
 },300);
});

let rt;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{
 const r=stage.getBoundingClientRect();
 if(state==='play'&&placed===0&&!drag&&(r.height>r.width)!==portrait)build();else layout();
},80)});
build();
})();
</script>
</body>
</html>
